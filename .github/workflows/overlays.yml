# Quarterly rebuild of the cycle and hiking route overlay for Europe, on the 1st of Jan/Apr/Jul/Oct.
# Each country is filtered to its route relations on its own runner (Europe whole is 35 GB, more
# than a runner's disk); one job then merges them and builds the tiles in a single pass, since a
# EuroVelo superroute spans a dozen countries and only carries its name where one pass sees all of
# it. The result is a new release `overlays-<date>`, and index.json points the app at it.
# A last job mirrors that build to the Cloudflare R2 bucket `navitals-packs`, which the web planner
# reads (a browser cannot read release assets: GitHub sends them without CORS headers). Another cuts
# each region's part out of it for the regions' offline maps (plan Phase 7m) and replaces those on
# navitals-maps, with NAVITALS_MAPS_TOKEN (see monthly.yml), skipped while it is missing.
#
# Scripts come from the private app repo with NAVITALS_TOOLS_TOKEN (see monthly.yml). The mirror
# writes with R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ENDPOINT, an R2 account API token with
# Object Read & Write on that bucket only, and skips itself while they are missing.
name: Quarterly route overlays

on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      mirror_only:
        description: "Only mirror the overlay index.json names to R2, without rebuilding"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  countries:
    if: ${{ !inputs.mirror_only }}
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: markettner/Navitals
          token: ${{ secrets.NAVITALS_TOOLS_TOKEN }}
          sparse-checkout: tools
          path: navitals
      - id: list
        run: echo "list=$(python3 navitals/tools/overlays/europe_countries.py)" >> "$GITHUB_OUTPUT"

  filter:
    needs: countries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        country: ${{ fromJSON(needs.countries.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: markettner/Navitals
          token: ${{ secrets.NAVITALS_TOOLS_TOKEN }}
          sparse-checkout: tools
          path: navitals
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh osmium-tool
      - name: Filter ${{ matrix.country.id }}
        run: |
          curl -fsSL --retry 3 -o extract.osm.pbf "${{ matrix.country.url }}"
          zsh navitals/tools/overlays/filter_routes.sh extract.osm.pbf "${{ matrix.country.id }}-routes.osm.pbf"
          rm extract.osm.pbf
          ls -la "${{ matrix.country.id }}-routes.osm.pbf"
      - uses: actions/upload-artifact@v4
        with:
          name: routes-${{ matrix.country.id }}
          path: ${{ matrix.country.id }}-routes.osm.pbf
          retention-days: 3

  build:
    needs: filter
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency: navitals-index
    steps:
      - name: Make room
        # The tiles need more than the runner's free disk; its preinstalled toolchains are not used.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Add swap
        # The build pass peaks at about 11.5 GB for Europe (measured 2026-09-25); the runner has 16.
        # Swap is the margin for OSM growing, so a slow build is the failure mode, not a killed one.
        run: |
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2 && free -h
      - uses: actions/checkout@v4
        with:
          path: packs-repo
      - uses: actions/checkout@v4
        with:
          repository: markettner/Navitals
          token: ${{ secrets.NAVITALS_TOOLS_TOKEN }}
          sparse-checkout: tools
          path: navitals
      - name: Install osmium, pyosmium and tippecanoe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh osmium-tool build-essential libsqlite3-dev zlib1g-dev
          python3 -m venv navitals/tools/overlays/.work/venv
          navitals/tools/overlays/.work/venv/bin/pip install -q "osmium==4.3.*"
          git clone -q --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" >/dev/null
          sudo make -C /tmp/tippecanoe install >/dev/null
      - name: Check the naming rules
        run: navitals/tools/overlays/.work/venv/bin/python -m doctest navitals/tools/overlays/build_route_overlay.py
      - uses: actions/download-artifact@v4
        with:
          pattern: routes-*
          path: routes
          merge-multiple: true
      - name: Build the overlay
        run: zsh navitals/tools/overlays/build_overlay.sh europe routes/*-routes.osm.pbf
      - name: Publish it and point the app at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C packs-repo config user.name "github-actions[bot]"
          git -C packs-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 navitals/tools/overlays/publish_overlay.py --index-checkout packs-repo \
            navitals/tools/overlays/.work/out/europe.pmtiles

  mirror:
    # After the build, or on its own with mirror_only. It reads the build from its release rather
    # than from the build job, so both ways run the same path.
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.mirror_only && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency: navitals-r2
    env:
      # A step's `if` cannot see secrets, nor its own env; this flag it can.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: markettner/Navitals
          token: ${{ secrets.NAVITALS_TOOLS_TOKEN }}
          sparse-checkout: tools
          path: navitals
      - name: Mirror the overlay to R2
        # Skipped until the secrets exist; the app's release and index are published either way.
        if: env.HAS_R2 == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python3 -m doctest navitals/tools/pipelines/r2.py
          python3 navitals/tools/overlays/mirror_r2.py

  region-overlays:
    # The new build's cut for every region, so an offline map's overlay is never a quarter behind.
    # Only after a build: a mirror_only run changes nothing the regions hold.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency: navitals-index
    env:
      # A step's `if` cannot see secrets, nor its own env; this flag it can.
      HAS_MAPS_TOKEN: ${{ secrets.NAVITALS_MAPS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_MAPS_TOKEN == 'true'
        with:
          path: packs-repo
      - uses: actions/checkout@v4
        if: env.HAS_MAPS_TOKEN == 'true'
        with:
          repository: markettner/Navitals
          token: ${{ secrets.NAVITALS_TOOLS_TOKEN }}
          sparse-checkout: tools
          path: navitals
      - name: Cut and publish each region's overlay
        if: env.HAS_MAPS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.NAVITALS_MAPS_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          python3 -m venv navitals/tools/maps/.work/venv
          curl -fsSL -o /tmp/pmtiles.tar.gz https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz
          echo "3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f  /tmp/pmtiles.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/pmtiles.tar.gz -C /usr/local/bin pmtiles
          # The build job pushed the new version to index.json before this job checked it out.
          export OVERLAY_VERSION=$(jq -r .overlay.version packs-repo/index.json)
          zsh navitals/tools/maps/build_map.sh --overlay-only
          git -C packs-repo config user.name "github-actions[bot]"
          git -C packs-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 navitals/tools/maps/publish_maps.py --index-checkout packs-repo navitals/tools/maps/.work/out/*/
